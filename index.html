<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="toggle" id="theme-toggle" aria-label="toggle light/dark">
    <span class="toggle-dot"></span><span id="toggle-label">light</span>
  </button>
  <main>
    <header>
      <h1>Notifications</h1>
      <p class="subtitle">One JSON pattern encodes a content standard. Deploy it to shape any draft to that standard, then grade how well it complies.</p>
    </header>

    <section class="input-area">
      <div class="field">
        <label for="library-select">Pattern</label>
        <select id="library-select">
          <option value="notifications">Notifications</option>
        </select>
        <p class="hint" id="pattern-hint"></p>
      </div>

      <div class="field">
        <label for="input-text">Your draft or brief</label>
        <textarea
          id="input-text"
          rows="6"
          placeholder="Paste a draft notification, or describe what you want to write..."></textarea>
      </div>

      <button id="rewrite-btn" type="button">Rewrite</button>
      <p class="status" id="status"></p>
    </section>

    <section class="output-area" id="output-area" hidden>
      <div class="output-block">
        <h2>Rewrite</h2>
        <div id="rewrite-output" class="rewrite"></div>
      </div>
      <div class="output-block">
        <h2>Grade</h2>
        <ul id="grade-output" class="grade"></ul>
      </div>
    </section>

    <footer>
      <p class="meta">v0 &middot; Library: <span id="library-count">1</span> pattern loaded.</p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>(function(){
    var root=document.documentElement,label=document.getElementById('toggle-label');
    var saved=null;try{saved=localStorage.getItem('brv-theme')}catch(e){}
    var initial=saved||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    set(initial);
    function set(t){root.setAttribute('data-theme',t);if(label)label.textContent=t;try{localStorage.setItem('brv-theme',t)}catch(e){}}
    document.getElementById('theme-toggle').addEventListener('click',function(){set(root.getAttribute('data-theme')==='dark'?'light':'dark')});
  })();</script>
</body>
</html>
